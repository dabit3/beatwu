<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- Social previews. %SITE_URL% is filled in at build time (see vite.config.ts) because crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scott Wu vs. You" />
    <meta property="og:title" content="Scott Wu vs. You: can you out-math Scott Wu?" />
    <meta property="og:description" content="Use every card. Hit 2025. Beat Scott Wu's 13.2 seconds. Don't get mogged." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Comic cover reading Scott Wu vs. You, with a tiny kid in pixel sunglasses, a +∞ aura burst, and the words Don't get mogged." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scott Wu vs. You: can you out-math Scott Wu?" />
    <meta name="twitter:description" content="Use every card. Hit 2025. Beat Scott Wu's 13.2 seconds. Don't get mogged." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
